<section #root id="contact" class="pt-20 pb-10">
  <p
    data-contact-item
    class="text-xs tracking-widest uppercase mb-8"
    style="color: var(--text-muted)"
  >
    Contact
  </p>

  <!-- Email -->
  <div data-contact-item class="py-6" style="border-bottom: 1px solid var(--border)">
    <p class="text-xs font-medium mb-2" style="color: var(--text-muted)">Email</p>
    <button
      (click)="copyEmail()"
      class="group flex items-center gap-3 text-xl sm:text-2xl font-medium tracking-tight transition-colors cursor-pointer text-left"
      style="color: var(--text-primary)"
    >
      {{ email }}
      <span class="inline-flex" style="color: var(--text-muted)">
        @if (copied()) {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 6L9 17l-5-5" />
          </svg>
        } @else {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg>
        }
      </span>
    </button>
  </div>

  <!-- Phone -->
  <div data-contact-item class="py-6" style="border-bottom: 1px solid var(--border)">
    <p class="text-xs font-medium mb-2" style="color: var(--text-muted)">Phone</p>
    <a
      [href]="'tel:' + phone"
      class="link-underline inline-block text-xl sm:text-2xl font-medium tracking-tight"
      style="color: var(--text-primary)"
    >
      {{ phone }}
    </a>
  </div>

  <!-- LinkedIn -->
  <div data-contact-item class="py-6">
    <p class="text-xs font-medium mb-2" style="color: var(--text-muted)">LinkedIn</p>
    <a
      [href]="linkedinUrl"
      target="_blank"
      rel="noopener"
      class="link-underline inline-block text-xl sm:text-2xl font-medium tracking-tight"
      style="color: var(--text-primary)"
    >
      LinkedIn profile page
    </a>
  </div>

  <!-- Footer row -->
  <div data-contact-item class="flex items-end justify-between mt-16">
    <a
      [href]="linkedinUrl"
      target="_blank"
      rel="noopener"
      class="btn-hover w-10 h-10 flex items-center justify-center rounded-md"
      style="
        background-color: var(--bg-surface);
        border: 1px solid var(--border);
        color: var(--text-secondary);
      "
      aria-label="LinkedIn"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="currentColor"
      >
        <path
          d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14zM8.34 17V9.96H6V17h2.34zM7.17 8.92a1.36 1.36 0 1 0 0-2.71 1.36 1.36 0 0 0 0 2.71zM18 17v-3.86c0-2.07-1.1-3.03-2.58-3.03-1.19 0-1.72.66-2.02 1.12V9.96h-2.34c.03.66 0 7.04 0 7.04h2.34v-3.93c0-.21.02-.42.08-.57.16-.42.55-.86 1.2-.86.84 0 1.18.64 1.18 1.58V17H18z"
        />
      </svg>
    </a>

    <div class="text-right">
      <p class="text-xs tracking-widest uppercase mb-1" style="color: var(--text-muted)">
        Local Time
      </p>
      <p class="text-xl sm:text-2xl font-medium tracking-tight" style="color: var(--text-primary)">
        {{ localTime() }}<span class="text-xs align-top ml-1">{{ meridiem() }}</span>
      </p>
    </div>
  </div>
</section>
