@if (hasProjects()) {
  <!--
    A plain grid rather than CSS-columns masonry: with only a handful of
    cards, column-based masonry fills the first column(s) top to bottom and
    leaves the last one mostly empty, reading as lopsided whitespace on the
    right. A grid keeps every column's top row aligned instead. Each card
    still sizes its own media to its natural aspect ratio, so a portrait
    clip renders full-height uncropped rather than getting cropped like it
    would in a uniform fixed-height cell. One column on mobile, three on
    desktop. The gallery sits inside the page's centred max-w-5xl column, so
    it inherits the hero's width and padding.
  -->
  <section #root class="w-full grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 items-start">
    @for (slide of slides(); track slide.project.title) {
      <!--
        A card in two parts, mirroring the reference: a dark media panel with
        a floating "Post" chip up top, and a separate footer strip below it
        holding an avatar + the project name — not overlaid on the media.
        data-card is the slide-up target; visibility is set by GSAP's autoAlpha.
      -->
      <div
        data-card
        (click)="openProject.emit(slide.project)"
        class="group rounded-xl md:rounded-2xl overflow-hidden cursor-pointer"
        style="visibility: hidden; background-color: var(--bg-panel); border: 1px solid var(--border)"
      >
        <div class="relative pt-1.5 px-1.5">
          <span
            class="absolute top-2 left-2 md:top-3 md:left-3 z-10 rounded-full px-2.5 py-1 text-[9px] md:text-[10px] font-semibold tracking-widest uppercase"
            style="background-color: rgba(0, 0, 0, 0.55); color: #fff; backdrop-filter: blur(4px)"
          >
            {{ slide.project.headline }}
          </span>

          @if (slide.feature; as feature) {
            @if (feature.video) {
              <!--
                `[muted]` must be a property binding, not a bare attribute:
                browsers gate autoplay on the muted PROPERTY, which Angular
                does not reflect from the attribute — without it the clip is
                blocked from starting.
              -->
              <video
                [src]="feature.src"
                [muted]="true"
                autoplay
                loop
                playsinline
                preload="auto"
                [style.aspect-ratio]="feature.ratio"
                class="w-full h-auto max-h-[32vh] md:max-h-none object-cover rounded-lg"
              ></video>
            } @else {
              <img
                [src]="feature.src"
                alt=""
                [style.aspect-ratio]="feature.ratio"
                class="w-full h-auto max-h-[32vh] md:max-h-none object-cover rounded-lg"
              />
            }
          } @else {
            <div
              [style.aspect-ratio]="'4 / 3'"
              class="w-full grid place-items-center rounded-lg"
              style="background-color: var(--bg-code)"
            >
              <p class="text-[10px] uppercase tracking-widest" style="color: var(--text-faint)">
                {{ slide.project.title }}
              </p>
            </div>
          }
        </div>

        <!-- Footer strip: avatar + project name, like the reference's author row. -->
        <div class="flex items-center gap-2.5 px-3 py-3">
          <span
            class="shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-[11px] font-bold uppercase"
            style="background-color: var(--bg-page); color: var(--text-primary)"
          >
            {{ slide.project.title.charAt(0) }}
          </span>
          <p
            class="min-w-0 truncate text-xs md:text-sm font-semibold tracking-tight"
            style="color: var(--text-primary)"
          >
            {{ slide.project.title }}
          </p>
        </div>
      </div>
    }
  </section>
}
