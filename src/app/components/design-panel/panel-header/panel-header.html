<div
  class="flex items-center justify-between px-6 py-5 shrink-0"
  style="border-bottom: 1px solid var(--border)"
>
  <!--
    Just the label here: the project's name is the hero heading immediately
    below, so repeating it in the bar would say the same thing twice.
  -->
  <p class="text-xs tracking-widest uppercase font-semibold" style="color: var(--accent-text)">
    Case Study
  </p>
  <button
    (click)="closePanel.emit()"
    class="w-8 h-8 flex items-center justify-center rounded-full transition-colors cursor-pointer"
    style="color: var(--text-muted)"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M18 6L6 18M6 6l12 12" />
    </svg>
  </button>
</div>
