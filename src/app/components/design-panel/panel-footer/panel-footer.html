@if (url()) {
  <!--
    Left-aligned and sized to its label: the panel is full-page now, so a
    full-width button would stretch the entire desktop viewport.
  -->
  <div
    class="px-6 py-4 shrink-0 w-full max-w-5xl mx-auto"
    style="border-top: 1px solid var(--border)"
  >
    <a
      [href]="url()"
      target="_blank"
      rel="noopener"
      class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl text-sm font-semibold tracking-wide transition-colors"
      style="background-color: var(--accent); color: var(--accent-on)"
      onmouseover="this.style.backgroundColor = 'var(--accent-hover)'"
      onmouseout="this.style.backgroundColor = 'var(--accent)'"
    >
      View Live Site
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M7 17L17 7M7 7h10v10" />
      </svg>
    </a>
  </div>
}
