<div class="flex items-center gap-3 flex-wrap">
  <button
    (click)="openDesignPanel.emit()"
    class="btn-hover px-5 py-2.5 text-sm font-semibold rounded-lg cursor-pointer"
    style="border: 1px solid var(--border-strong); color: var(--text-primary)"
  >
    Case Study
  </button>
  @if (url()) {
    <a
      [href]="url()"
      target="_blank"
      rel="noopener"
      class="btn-hover group px-5 py-2.5 text-sm font-semibold rounded-lg flex items-center gap-1.5"
      style="background-color: var(--accent); color: var(--accent-on)"
      onmouseover="this.style.backgroundColor = 'var(--accent-hover)'"
      onmouseout="this.style.backgroundColor = 'var(--accent)'"
    >
      Live Site
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="transition-transform duration-200 group-hover:translate-x-0.5 group-hover:-translate-y-0.5"
      >
        <path d="M7 17L17 7M7 7h10v10" />
      </svg>
    </a>
  }
</div>
